<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECHT PASSIERT – Karte</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

#map {
  width: 100%;
  height: 100vh;
  background: #f4f1ec;
}

.city-marker {
  width: 22px;
  height: 22px;
  position: relative;
}

.city-marker::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  border: 2px solid #e30613;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.city-marker::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  background: #e30613;
  border-radius: 50%;
  top: 7px;
  left: 7px;
  box-shadow: 0 0 14px rgba(227,6,19,.8);
}

@keyframes pulse {
  0% {
    transform: scale(.7);
    opacity: 1;
  }

  70% {
    transform: scale(2);
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}

.city-label {
  background: white;
  border: none !important;
  border-radius: 4px;
  padding: 6px 10px;
  color: #111;
  font-family: Arial, sans-serif;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 3px 14px rgba(0,0,0,.15);
}

.leaflet-tooltip.city-label::before {
  display: none;
}

.leaflet-control-zoom a {
  width: 38px !important;
  height: 38px !important;
  line-height: 38px !important;
  font-size: 20px !important;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map", {
  zoomControl: true,
  dragging: true,
  scrollWheelZoom: true,
  doubleClickZoom: true,
  touchZoom: true,
  minZoom: 5,
  maxZoom: 12
});

map.setView([51.2, 10.4], 6);

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

const cities = [

  {
    name: "Hamburg",
    lat: 53.5511,
    lon: 9.9937
  },

  {
    name: "Berlin",
    lat: 52.5200,
    lon: 13.4050
  },

  {
    name: "Köln",
    lat: 50.9375,
    lon: 6.9603
  },

  {
    name: "Dresden",
    lat: 51.0504,
    lon: 13.7373
  },

  {
    name: "München",
    lat: 48.1351,
    lon: 11.5820
  }

];

cities.forEach(city => {

  const icon = L.divIcon({
    className: "",
    html: '<div class="city-marker"></div>',
    iconSize: [22,22],
    iconAnchor: [11,11]
  });

  const marker = L.marker(
    [city.lat, city.lon],
    { icon: icon }
  ).addTo(map);

  marker.bindTooltip(
    city.name,
    {
      permanent: true,
      direction: "right",
      offset: [15,0],
      className: "city-label"
    }
  );

  marker.on("click", function() {

    alert(
      "Hier wird später die " +
      city.name +
      "-Seite geöffnet."
    );

  });

});

</script>

</body>
</html>
