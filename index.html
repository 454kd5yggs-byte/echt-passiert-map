<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECHT PASSIERT – Karte</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4f1eb;
  font-family: Arial, Helvetica, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
  background: #f4f1eb;
}

/* Zoom-Steuerung */
.leaflet-control-zoom {
  border: none !important;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10);
}

.leaflet-control-zoom a {
  width: 38px !important;
  height: 38px !important;
  line-height: 38px !important;
  background: rgba(255,255,255,0.95) !important;
  color: #181818 !important;
  border: none !important;
  font-weight: 400;
}

/* Kartenhinweis */
.leaflet-control-attribution {
  background: rgba(244,241,235,0.85) !important;
  color: #888 !important;
  font-size: 9px;
}

/* Stadtmarker */
.city-marker {
  position: relative;
  width: 190px;
  height: 70px;
  transform: translate(-95px, -35px);
  cursor: pointer;
}

/* Leuchtender Punkt */
.city-dot {
  position: absolute;
  left: 83px;
  top: 28px;
  width: 12px;
  height: 12px;
  background: #c9002b;
  border-radius: 50%;
  box-shadow:
    0 0 0 4px rgba(201,0,43,0.10),
    0 0 12px rgba(201,0,43,0.45);
}

/* Pulsieren */
.city-dot::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  left: 0;
  top: 0;
  border-radius: 50%;
  border: 1px solid #c9002b;
  animation: cityPulse 2.2s ease-out infinite;
}

@keyframes cityPulse {
  0% {
    transform: scale(1);
    opacity: 0.8;
  }

  70% {
    transform: scale(2.8);
    opacity: 0;
  }

  100% {
    transform: scale(2.8);
    opacity: 0;
  }
}

/* Städtenamen */
.city-name {
  position: absolute;
  left: 106px;
  top: 20px;

  white-space: nowrap;

  color: #161616;
  background: rgba(244,241,235,0.94);

  padding: 5px 9px;

  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.025em;

  border-left: 2px solid #c9002b;

  box-shadow: 0 3px 12px rgba(0,0,0,0.06);

  transition:
    transform 0.25s ease,
    background 0.25s ease;
}

/* Hover */
.city-marker:hover .city-name {
  transform: translateX(4px);
  background: #ffffff;
}

.city-marker:hover .city-dot {
  box-shadow:
    0 0 0 5px rgba(201,0,43,0.14),
    0 0 22px rgba(201,0,43,0.65);
}


/* Popup */
.leaflet-popup-content-wrapper {
  background: #f4f1eb;
  border-radius: 2px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.16);
}

.leaflet-popup-tip {
  background: #f4f1eb;
}

.leaflet-popup-content {
  margin: 20px 22px;
  min-width: 190px;
}

.popup-kicker {
  color: #c9002b;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.popup-title {
  color: #151515;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
}

.popup-text {
  color: #666;
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map", {
  zoomControl: true,
  dragging: true,
  scrollWheelZoom: true,
  doubleClickZoom: true,
  touchZoom: true,
  minZoom: 5,
  maxZoom: 12,
  zoomSnap: 0.5
});


/* Helle Editorial-Karte */
L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {
    maxZoom: 20,
    attribution:
      '&copy; OpenStreetMap-Mitwirkende &copy; CARTO'
  }
).addTo(map);


/* Städte */
const cities = [

  {
    name: "Berlin",
    lat: 52.5200,
    lon: 13.4050
  },

  {
    name: "Hamburg",
    lat: 53.5511,
    lon: 9.9937
  },

  {
    name: "Köln",
    lat: 50.9375,
    lon: 6.9603
  },

  {
    name: "München",
    lat: 48.1351,
    lon: 11.5820
  },

  {
    name: "Dresden",
    lat: 51.0504,
    lon: 13.7373
  }

];


/* Städte auf Karte setzen */
cities.forEach(city => {

  const icon = L.divIcon({

    className: "",

    html: `
      <div class="city-marker">

        <div class="city-dot"></div>

        <div class="city-name">
          ${city.name}
        </div>

      </div>
    `,

    iconSize: [190,70],

    iconAnchor: [95,35]

  });


  const marker = L.marker(
    [city.lat, city.lon],
    {
      icon: icon,
      interactive: true
    }
  ).addTo(map);


  /* Klick auf Stadt */

  marker.on("click", function() {

  map.flyTo(
    [city.lat, city.lon],
    9,
    {
      duration: 1.2
    }
  );

  setTimeout(() => {

    marker.bindPopup(`
      <div class="popup-kicker">
        ECHT PASSIERT
      </div>

      <div class="popup-title">
        ${city.name}
      </div>

      <div class="popup-text">
        Geschichten aus ${city.name}
      </div>

      <button
        class="popup-button"
        onclick="alert('Hier werden bald die Geschichten aus ${city.name} angezeigt.')"
      >
        Geschichten entdecken →
      </button>
    `).openPopup();

  }, 900);

});

});


/* Deutschland beim Start einpassen */

const germanyBounds = [
  [47.2, 5.8],
  [55.1, 15.2]
];

map.fitBounds(
  germanyBounds,
  {
    padding: [25,25]
  }
);

</script>

</body>
</html>
